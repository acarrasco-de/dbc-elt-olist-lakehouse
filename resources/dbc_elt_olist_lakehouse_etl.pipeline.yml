resources:
  pipelines:
    dbc_elt_olist_lakehouse_etl:
      name: dbc_elt_olist_lakehouse_etl
      catalog: ${var.catalog}
      schema: ${var.schema_bronze}
      serverless: true
      root_path: "../src/dbc_elt_olist_lakehouse_etl"

      configuration:
        landing: ${var.landing_root}/landing/olist
        schema_store: ${var.landing_root}/schemas

      libraries:
        - glob:
            include: ../src/dbc_elt_olist_lakehouse_etl/transformations/**

      environment:
        dependencies:
          - --editable ${workspace.file_path}
