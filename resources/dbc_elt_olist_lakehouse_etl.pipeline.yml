# The main pipeline for dbc_elt_olist_lakehouse

resources:
  pipelines:
    dbc_elt_olist_lakehouse_etl:
      name: dbc_elt_olist_lakehouse_etl
      catalog: ${var.catalog}
      schema: ${var.schema_bronze}
      serverless: true
      root_path: "../src/dbc_elt_olist_lakehouse_etl"

      libraries:
        - glob:
            include: ../src/dbc_elt_olist_lakehouse_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
